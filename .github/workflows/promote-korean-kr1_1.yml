name: Promote Korean KR1.1 to Release

on:
  push:
    branches:
      - update/openmw-0.51.0-09
    paths:
      - .github/workflows/promote-korean-kr1_1.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: android-korean-0.51.0-09-kr1.1
    steps:
      - name: Promote existing KR1.1 prerelease to full release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          cat > /tmp/release-update.json <<'EOF'
          {
            "name": "OpenMW Android 0.51.0-09 Korean KR1.1 (16 KiB)",
            "prerelease": false,
            "draft": false,
            "make_latest": "true",
            "body": "## OpenMW Android 0.51.0-09 Korean KR1.1 — 16 KiB\n\nOpenMW Android 0.51.0-09 기반 한국어 ARM64 정식 릴리즈입니다.\n\nKR1.1은 KR1의 게임 기능 변경판이 아니라, 작업용/구형 CI를 정리한 뒤 현행 NDK r27d + 16 KiB 빌드·검증 경로에서 다시 생성한 배포 정리판입니다.\n\n### 포함 사항\n- OpenMW Android 0.51.0-09 네이티브 패치 체인 적용\n- 한국어 CJK 토픽 탐색 / UTF-8 BOM sidecar / 혼합 UTF-8 ESM 패치 적용\n- MysticCards 폰트 fallback 유지\n- NDK r27d로 ARM64 네이티브 라이브러리 재빌드\n- APK에 포함되는 ARM64 공유 라이브러리 전체 ELF PT_LOAD 최소 16 KiB 정렬 검증\n- APK ZIP 16 KiB 정렬 검증\n- versionCode 5109 / versionName 0.51.0-09 검증\n- 공개 검증 자료를 `16k-verification.txt` 하나로 정리\n\n### 설치에 필요한 한글 데이터\n한글 번역 데이터와 OMWFont는 APK에 포함하지 않습니다. [OpenMW 0.51.0 KR1 한글패치](https://github.com/munument1/-KR-openmw/releases/tag/openmw-0.51.0-kr1)를 별도로 설치해야 합니다.\n\n### 알려진 제한사항\n- Android debug 인증서로 서명된 빌드입니다. 기존 설치본과 서명이 다르면 설정/데이터를 백업한 뒤 기존 앱을 제거하고 새로 설치해야 합니다.\n- APK/ELF 정적 16 KiB 검증은 완료했지만 실제 16 KiB 페이지 기기에서의 장시간 플레이 검증은 별도로 필요합니다."
          }
          EOF
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --input /tmp/release-update.json

      - name: Verify full release state
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json url,tagName,name,isDraft,isPrerelease,isLatest,targetCommitish
