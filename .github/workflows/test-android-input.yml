name: Test Android Input Branch

on:
  pull_request:
    branches:
      - fix/android-input-controls

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      JOBS: '2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git curl wget patch unzip zip python3 perl autoconf automake libtool libtool-bin pkg-config bison flex gettext gperf nasm yasm texinfo bzip2 xz-utils
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: |
            source/buildscripts/downloads
            source/buildscripts/toolchain
            source/buildscripts/prefix/arm64
            source/buildscripts/build/arm64
            !source/buildscripts/build/arm64/openmw-prefix
          key: ${{ runner.os }}-openmw051-r26b-arm64-deps-v2-${{ hashFiles('source/buildscripts/CMakeLists.txt', 'source/buildscripts/include/version.sh') }}
          restore-keys: |
            ${{ runner.os }}-openmw051-r26b-arm64-deps-v2-

      - name: Build and verify Korean KR1 runtime
        shell: bash
        run: |
          chmod +x ci/build-korean-kr1.sh
          ./ci/build-korean-kr1.sh

      - name: Upload APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-Android-input-test
          path: |
            source/app/build/outputs/apk/mainline/debug/OpenMW-Android-0.51.0-04-Korean-KR1.apk
            source/app/build/outputs/apk/mainline/debug/OpenMW-Android-0.51.0-04-Korean-KR1.apk.sha256
            korean-origin.txt
            korean-origin-libopenmw.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
