name: Package Korean Android mod

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "source/app/openmw.base.cfg"
      - "source/app/src/main/java/file/IniConverter.kt"
      - "source/app/src/test/java/file/IniConverterTest.kt"
      - "source/tools/package-korean-omwfont-mod.py"
      - "source/tools/assets/MysticCards.omwfont"
      - "source/tools/.ci-input/current-kr1-rc10l-no-fonts.zip"
      - ".github/workflows/package-korean-android-mod.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      GALMURI_REPO: quiple/galmuri
      GALMURI_TAG: v2.40.4
      GALMURI_SHA256: e24256f42e43713d2ea086a1e1669d78b968f5b3cc547e5c157f0606ffa5def1
      PINNED_KR1_INPUT: source/tools/.ci-input/current-kr1-rc10l-no-fonts.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require current KR1 RC10l translation payload
        id: translation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/base

          if [ ! -f "$PINNED_KR1_INPUT" ]; then
            echo "ERROR: current KR1/RC10l payload is not present at $PINNED_KR1_INPUT" >&2
            echo "RC9 and public RC10j diagnostic assets are intentionally forbidden as fallbacks." >&2
            exit 1
          fi

          base_zip="work/base/current-kr1-rc10l-no-fonts.zip"
          cp "$PINNED_KR1_INPUT" "$base_zip"
          echo "Using branch-pinned current KR1/RC10l translation payload"
          echo "tag=current-kr1-rc10l" >> "$GITHUB_OUTPUT"
          echo "asset=current-kr1-rc10l-no-fonts.zip" >> "$GITHUB_OUTPUT"
          echo "updated=branch-pinned" >> "$GITHUB_OUTPUT"
          echo "base_zip=$base_zip" >> "$GITHUB_OUTPUT"
          sha256sum "$base_zip"

      - name: Download pinned Galmuri 2.40.4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/galmuri
          gh release download "$GALMURI_TAG" --repo "$GALMURI_REPO" \
            --pattern "Galmuri-${GALMURI_TAG}.zip" --dir work/galmuri
          unzip -q "work/galmuri/Galmuri-${GALMURI_TAG}.zip" -d work/galmuri/dist

          test -f work/galmuri/dist/Galmuri11.ttf
          actual="$(sha256sum work/galmuri/dist/Galmuri11.ttf | awk '{print $1}')"
          echo "Galmuri11.ttf SHA-256: $actual"
          test "$actual" = "$GALMURI_SHA256"

          gh api "repos/${GALMURI_REPO}/contents/ofl.md?ref=${GALMURI_TAG}" \
            --jq '.content' | tr -d '\n' | base64 -d > work/galmuri/Galmuri11-OFL-1.1.md
          grep -qi "SIL OPEN FONT LICENSE" work/galmuri/Galmuri11-OFL-1.1.md
          grep -qi "Version 1.1" work/galmuri/Galmuri11-OFL-1.1.md

      - name: Assemble Android ReTranslation package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 source/tools/package-korean-omwfont-mod.py \
            --base-zip "${{ steps.translation.outputs.base_zip }}" \
            --omwfont source/tools/assets/MysticCards.omwfont \
            --ttf work/galmuri/dist/Galmuri11.ttf \
            --font-license work/galmuri/Galmuri11-OFL-1.1.md \
            --output out/Morrowind_Korean_ReTranslation_Android_OMWFont.zip

          unzip -l out/Morrowind_Korean_ReTranslation_Android_OMWFont.zip
          sha256sum out/Morrowind_Korean_ReTranslation_Android_OMWFont.zip | tee out/SHA256SUMS.txt
          printf 'translation_tag=%s\ntranslation_asset=%s\ntranslation_asset_updated=%s\nfont_slot=MysticCards\n' \
            '${{ steps.translation.outputs.tag }}' \
            '${{ steps.translation.outputs.asset }}' \
            '${{ steps.translation.outputs.updated }}' \
            > out/SOURCE.txt

      - name: Upload installable Korean mod
        uses: actions/upload-artifact@v4
        with:
          name: Morrowind_Korean_ReTranslation_Android_OMWFont
          path: |
            out/Morrowind_Korean_ReTranslation_Android_OMWFont.zip
            out/SHA256SUMS.txt
            out/SOURCE.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
