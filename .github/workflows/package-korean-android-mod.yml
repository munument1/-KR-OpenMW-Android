name: Package Korean Android mod

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "source/app/openmw.base.cfg"
      - "source/app/src/main/java/file/IniConverter.kt"
      - "source/app/src/test/java/file/IniConverterTest.kt"
      - "source/tools/package-korean-omwfont-mod.py"
      - "source/tools/assets/KR_OpenMW_Korean.omwfont"
      - ".github/workflows/package-korean-android-mod.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TRANSLATION_REPO: munument1/OpenMW-korean
      GALMURI_REPO: quiple/galmuri
      GALMURI_TAG: v2.40.4
      GALMURI_SHA256: e24256f42e43713d2ea086a1e1669d78b968f5b3cc547e5c157f0606ffa5def1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate latest production ReTranslation release asset
        id: translation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/base
          : > work/release-assets.txt

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "Release $tag assets:"
            gh release view "$tag" --repo "$TRANSLATION_REPO" --json assets \
              --jq '.assets[] | [.updatedAt, .name] | @tsv' | tee work/current-assets.txt

            python3 - "$tag" work/current-assets.txt work/release-assets.txt <<'PY'
          import re
          import sys
          from pathlib import Path

          tag = sys.argv[1]
          current = Path(sys.argv[2])
          output = Path(sys.argv[3])

          rows = []
          for raw in current.read_text(encoding="utf-8").splitlines():
              if not raw.strip():
                  continue
              updated, name = raw.split("\t", 1)
              lower = name.lower()
              if not lower.endswith(".zip"):
                  continue
              if not (
                  ("morrowind-korean-openmw" in lower and "full" in lower)
                  or lower.startswith("morrowind_korean_retranslation")
              ):
                  continue
              # Never silently package diagnostic/minimal artifacts as a release.
              if any(token in lower for token in ("test", "parser", "closure", "minimal", "debug", "diagnostic")):
                  continue
              rows.append((updated, tag, name))

          if rows:
              # Asset updatedAt is ISO-8601, so lexical ordering is chronological.
              rows.sort(reverse=True)
              with output.open("a", encoding="utf-8") as f:
                  for updated, release_tag, name in rows:
                      f.write(f"{updated}\t{release_tag}\t{name}\n")
          PY

            # gh release list is newest release first. As soon as this release has
            # a production package, do not fall through to an older release.
            if [ -s work/release-assets.txt ]; then
              break
            fi
          done < <(gh release list --repo "$TRANSLATION_REPO" --limit 50 --json tagName --jq '.[].tagName')

          if [ ! -s work/release-assets.txt ]; then
            echo "No production ReTranslation/Full ZIP found in $TRANSLATION_REPO releases" >&2
            exit 1
          fi

          sort -r work/release-assets.txt > work/release-assets.sorted.txt
          IFS=$'\t' read -r updated tag asset < work/release-assets.sorted.txt
          echo "Selected translation release: $tag / $asset ($updated)"
          gh release download "$tag" --repo "$TRANSLATION_REPO" --pattern "$asset" --dir work/base

          base_zip="work/base/$asset"
          test -f "$base_zip"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "updated=$updated" >> "$GITHUB_OUTPUT"
          echo "base_zip=$base_zip" >> "$GITHUB_OUTPUT"
          sha256sum "$base_zip"

      - name: Download pinned Galmuri 2.40.4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/galmuri
          gh release download "$GALMURI_TAG" --repo "$GALMURI_REPO" \
            --pattern "Galmuri-${GALMURI_TAG}.zip" --dir work/galmuri
          unzip -q "work/galmuri/Galmuri-${GALMURI_TAG}.zip" -d work/galmuri/dist

          test -f work/galmuri/dist/Galmuri11.ttf
          actual="$(sha256sum work/galmuri/dist/Galmuri11.ttf | awk '{print $1}')"
          echo "Galmuri11.ttf SHA-256: $actual"
          test "$actual" = "$GALMURI_SHA256"

          gh api "repos/${GALMURI_REPO}/contents/ofl.md?ref=${GALMURI_TAG}" \
            --jq '.content' | tr -d '\n' | base64 -d > work/galmuri/Galmuri11-OFL-1.1.md
          grep -qi "SIL OPEN FONT LICENSE" work/galmuri/Galmuri11-OFL-1.1.md
          grep -qi "Version 1.1" work/galmuri/Galmuri11-OFL-1.1.md

      - name: Assemble Android ReTranslation package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 source/tools/package-korean-omwfont-mod.py \
            --base-zip "${{ steps.translation.outputs.base_zip }}" \
            --omwfont source/tools/assets/KR_OpenMW_Korean.omwfont \
            --ttf work/galmuri/dist/Galmuri11.ttf \
            --font-license work/galmuri/Galmuri11-OFL-1.1.md \
            --output out/Morrowind_Korean_ReTranslation_Android_OMWFont.zip

          unzip -l out/Morrowind_Korean_ReTranslation_Android_OMWFont.zip
          sha256sum out/Morrowind_Korean_ReTranslation_Android_OMWFont.zip | tee out/SHA256SUMS.txt
          printf 'translation_tag=%s\ntranslation_asset=%s\ntranslation_asset_updated=%s\n' \
            '${{ steps.translation.outputs.tag }}' \
            '${{ steps.translation.outputs.asset }}' \
            '${{ steps.translation.outputs.updated }}' \
            > out/SOURCE.txt

      - name: Upload installable Korean mod
        uses: actions/upload-artifact@v4
        with:
          name: Morrowind_Korean_ReTranslation_Android_OMWFont
          path: |
            out/Morrowind_Korean_ReTranslation_Android_OMWFont.zip
            out/SHA256SUMS.txt
            out/SOURCE.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
