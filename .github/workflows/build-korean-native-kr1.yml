name: Build Korean Native KR1

on:
  workflow_dispatch:
  push:
    branches:
      - update/openmw-0.51.0-09
    paths:
      - ci/native-build-trigger.txt

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      JOBS: '4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git curl wget patch unzip zip python3 perl autoconf automake libtool libtool-bin pkg-config bison flex gettext gperf nasm yasm texinfo bzip2 xz-utils

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: |
            source/buildscripts/downloads
            source/buildscripts/toolchain
            source/buildscripts/prefix/arm64
            source/buildscripts/build/arm64
            !source/buildscripts/build/arm64/openmw-prefix
          key: ${{ runner.os }}-openmw051-r26b-arm64-deps-v3-${{ hashFiles('source/buildscripts/CMakeLists.txt', 'source/buildscripts/include/version.sh') }}
          restore-keys: |
            ${{ runner.os }}-openmw051-r26b-arm64-deps-v3-
            ${{ runner.os }}-openmw051-r26b-arm64-deps-v2-

      - name: Build Korean 0.51.0-09 native runtime
        shell: bash
        run: |
          chmod +x ci/build-korean-native-kr1.sh
          ./ci/build-korean-native-kr1.sh

      - name: Upload native runtime and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-0.51.0-09-Korean-native-KR1
          path: |
            native-artifacts/libopenmw.so
            native-artifacts/libopenmw.so.sha256
            native-artifacts/upstream-libopenmw.sha256
            native-artifacts/page-size-report.txt
            native-artifacts/korean-origin.txt
            native-artifacts/korean-native-build.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
