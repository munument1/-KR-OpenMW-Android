name: Build Korean 0.51.0-10 KR1 test

on:
  workflow_dispatch:
  push:
    branches:
      - update/openmw-0.51.0-10
    paths:
      - ci/native-build-trigger.txt

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      JOBS: '4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build requirements and NDK r27d
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git curl wget patch unzip zip python3 perl autoconf automake libtool libtool-bin pkg-config bison flex gettext gperf nasm yasm texinfo bzip2 xz-utils
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'ndk;27.3.13750724' 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Restore 16K native dependency cache
        uses: actions/cache@v4
        with:
          path: |
            source/buildscripts/downloads
            source/buildscripts/prefix/arm64
            source/buildscripts/build/arm64
            !source/buildscripts/build/arm64/openmw-prefix
          key: ${{ runner.os }}-openmw051-r27d-arm64-16k-v3-${{ hashFiles('source/buildscripts/CMakeLists.txt', 'source/buildscripts/include/version.sh', 'ci/build-korean-native-kr1.sh', 'ci/patch-sdl2-ndk-r27.sh') }}
          restore-keys: |
            ${{ runner.os }}-openmw051-r27d-arm64-16k-v3-
            ${{ runner.os }}-openmw051-r27d-arm64-16k-v2-

      - name: Build Korean 0.51.0-10 native runtime
        shell: bash
        run: |
          chmod +x ci/patch-sdl2-ndk-r27.sh ci/build-korean-native-kr1.sh
          ./ci/patch-sdl2-ndk-r27.sh
          ./ci/build-korean-native-kr1.sh

      - name: Package and verify 16K Korean APK
        shell: bash
        env:
          NATIVE_INPUT: native-artifacts
        run: |
          chmod +x ci/package-korean-native-kr1.sh
          ./ci/package-korean-native-kr1.sh

      - name: Package Korean data, font and video subtitles
        shell: bash
        run: |
          chmod +x ci/package-korean-data.sh
          ./ci/package-korean-data.sh

      - name: Upload native runtime and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-0.51.0-10-Korean-native-KR1-Test-16K
          path: |
            native-artifacts/libopenmw.so
            native-artifacts/libopenmw.so.sha256
            native-artifacts/libs/*.so
            native-artifacts/upstream-libopenmw.sha256
            native-artifacts/page-size-report.txt
            native-artifacts/korean-origin.txt
            native-artifacts/korean-native-build.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Upload verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-Android-0.51.0-10-Korean-KR1-Test-16K
          path: |
            release-artifacts/OpenMW-Android-0.51.0-10-Korean-KR1-Test-16K.apk
            release-artifacts/OpenMW-Android-0.51.0-10-Korean-KR1-Test-16K.apk.sha256
            release-artifacts/16k-verification.txt
            release-artifacts/native-page-size-report.txt
            release-artifacts/apk-page-size-report.txt
            release-artifacts/native-build-page-size-report.txt
            release-artifacts/korean-origin.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Korean data package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-Android-0.51.0-10-Korean-Data-KR3
          path: |
            release-artifacts/OpenMW-Android-0.51.0-10-Korean-Data-KR3.zip
            release-artifacts/OpenMW-Android-0.51.0-10-Korean-Data-KR3.zip.sha256
            release-artifacts/korean-data-verification.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
