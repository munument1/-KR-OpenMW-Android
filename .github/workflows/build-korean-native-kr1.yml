name: Build and Release Korean 0.51.0-09 KR1.1

on:
  workflow_dispatch:
  push:
    branches:
      - update/openmw-0.51.0-09
    paths:
      - ci/native-build-trigger.txt

permissions:
  contents: write

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      JOBS: '4'
      RELEASE_TAG: android-korean-0.51.0-09-kr1.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build requirements and NDK r27d
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git curl wget patch unzip zip python3 perl autoconf automake libtool libtool-bin pkg-config bison flex gettext gperf nasm yasm texinfo bzip2 xz-utils
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'ndk;27.3.13750724' 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Restore 16K native dependency cache
        uses: actions/cache@v4
        with:
          path: |
            source/buildscripts/downloads
            source/buildscripts/prefix/arm64
            source/buildscripts/build/arm64
            !source/buildscripts/build/arm64/openmw-prefix
          key: ${{ runner.os }}-openmw051-r27d-arm64-16k-v2-${{ hashFiles('source/buildscripts/CMakeLists.txt', 'source/buildscripts/include/version.sh', 'ci/build-korean-native-kr1.sh', 'ci/patch-sdl2-ndk-r27.sh') }}
          restore-keys: |
            ${{ runner.os }}-openmw051-r27d-arm64-16k-v2-

      - name: Build Korean 0.51.0-09 native runtime
        shell: bash
        run: |
          chmod +x ci/patch-sdl2-ndk-r27.sh ci/build-korean-native-kr1.sh
          ./ci/patch-sdl2-ndk-r27.sh
          ./ci/build-korean-native-kr1.sh

      - name: Package and verify 16K Korean APK
        shell: bash
        env:
          NATIVE_INPUT: native-artifacts
        run: |
          chmod +x ci/package-korean-native-kr1.sh
          ./ci/package-korean-native-kr1.sh

      - name: Upload native runtime and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-0.51.0-09-Korean-native-KR1.1-16K
          path: |
            native-artifacts/libopenmw.so
            native-artifacts/libopenmw.so.sha256
            native-artifacts/libs/*.so
            native-artifacts/upstream-libopenmw.sha256
            native-artifacts/page-size-report.txt
            native-artifacts/korean-origin.txt
            native-artifacts/korean-native-build.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Upload verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-Android-0.51.0-09-Korean-KR1.1-16K
          path: |
            release-artifacts/OpenMW-Android-0.51.0-09-Korean-KR1.1-16K.apk
            release-artifacts/OpenMW-Android-0.51.0-09-Korean-KR1.1-16K.apk.sha256
            release-artifacts/16k-verification.txt
            release-artifacts/native-page-size-report.txt
            release-artifacts/apk-page-size-report.txt
            release-artifacts/native-build-page-size-report.txt
            release-artifacts/korean-origin.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish Korean 0.51.0-09 KR1.1 prerelease
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK='release-artifacts/OpenMW-Android-0.51.0-09-Korean-KR1.1-16K.apk'
          SHA='release-artifacts/OpenMW-Android-0.51.0-09-Korean-KR1.1-16K.apk.sha256'
          VERIFY='release-artifacts/16k-verification.txt'
          ORIGIN='release-artifacts/korean-origin.txt'
          cat > release-artifacts/release-notes.md <<'EOF'
          ## OpenMW Android 0.51.0-09 Korean KR1.1 — 16 KiB prerelease

          OpenMW Android 0.51.0-09 기반 한국어 ARM64 프리릴리즈입니다.

          KR1.1은 KR1의 게임 기능 변경판이 아니라, 작업용/구형 CI를 정리한 뒤 현행 NDK r27d + 16 KiB 빌드·검증 경로에서 다시 생성한 배포 정리판입니다.

          ### 포함 사항
          - OpenMW Android 0.51.0-09 네이티브 패치 체인 적용
          - 한국어 CJK 토픽 탐색 / UTF-8 BOM sidecar / 혼합 UTF-8 ESM 패치 적용
          - MysticCards 폰트 fallback 유지
          - NDK r27d로 ARM64 네이티브 라이브러리 재빌드
          - APK에 포함되는 ARM64 공유 라이브러리 전체 ELF PT_LOAD 최소 16 KiB 정렬 검증
          - APK ZIP 16 KiB 정렬 검증
          - versionCode 5109 / versionName 0.51.0-09 검증
          - 공개 검증 자료를 `16k-verification.txt` 하나로 정리

          ### 설치에 필요한 한글 데이터
          한글 번역 데이터와 OMWFont는 APK에 포함하지 않습니다. [OpenMW 0.51.0 KR1 한글패치](https://github.com/munument1/-KR-openmw/releases/tag/openmw-0.51.0-kr1)를 별도로 설치해야 합니다.

          ### 알려진 제한사항
          - Android debug 인증서로 서명된 프리릴리즈입니다. 기존 설치본과 서명이 다르면 설정/데이터를 백업한 뒤 기존 앱을 제거하고 새로 설치해야 합니다.
          - APK/ELF 정적 16 KiB 검증은 완료했지만 실제 16 KiB 페이지 기기에서의 장시간 플레이 검증은 별도로 필요합니다.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" "$SHA" "$VERIFY" "$ORIGIN" --clobber
            gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title 'OpenMW Android 0.51.0-09 Korean KR1.1 (16 KiB)' \
              --prerelease \
              --notes-file release-artifacts/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              "$APK" "$SHA" "$VERIFY" "$ORIGIN" \
              --target "$GITHUB_SHA" \
              --title 'OpenMW Android 0.51.0-09 Korean KR1.1 (16 KiB)' \
              --prerelease \
              --notes-file release-artifacts/release-notes.md
          fi

      - name: Verify published prerelease
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json url,tagName,name,isDraft,isPrerelease,targetCommitish
