name: Build Korean Android KR1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install lightweight build requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip binutils
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Assemble and verify Korean KR1 runtime
        shell: bash
        run: |
          chmod +x ci/build-korean-kr1.sh
          ./ci/build-korean-kr1.sh

      - name: Upload APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-Android-0.51.0-09-Korean-KR1
          path: |
            source/app/build/outputs/apk/mainline/debug/OpenMW-Android-0.51.0-09-Korean-KR1.apk
            source/app/build/outputs/apk/mainline/debug/OpenMW-Android-0.51.0-09-Korean-KR1.apk.sha256
            korean-origin.txt
            korean-origin-libopenmw.sha256
            page-size-report.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
