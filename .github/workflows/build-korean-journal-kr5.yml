name: Build Korean 0.51.0-11 KR1.2 journal candidate

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Optional run containing a verified patch-0007 native artifact
        required: false
        default: ''
        type: string
  push:
    branches:
      - update/openmw-0.51.0-11
    paths:
      - ci/native-build-trigger.txt

permissions:
  contents: read
  actions: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      JOBS: '4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install native build requirements and NDK r27d
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git curl wget patch unzip zip python3 perl autoconf automake libtool libtool-bin pkg-config bison flex gettext gperf nasm yasm texinfo bzip2 xz-utils
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'ndk;27.3.13750724' 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Restore 16K native dependency cache
        if: ${{ inputs.native_run_id == '' }}
        uses: actions/cache@v4
        with:
          path: |
            source/buildscripts/downloads
            source/buildscripts/prefix/arm64
            source/buildscripts/build/arm64
            !source/buildscripts/build/arm64/openmw-prefix
          key: ${{ runner.os }}-openmw051-r27d-arm64-16k-v3-${{ hashFiles('source/buildscripts/CMakeLists.txt', 'source/buildscripts/include/version.sh', 'ci/build-korean-native-kr1.sh', 'ci/patch-sdl2-ndk-r27.sh') }}
          restore-keys: |
            ${{ runner.os }}-openmw051-r27d-arm64-16k-v3-
            ${{ runner.os }}-openmw051-r27d-arm64-16k-v2-

      - name: Build Korean 0.51.0-11 native runtime
        if: ${{ inputs.native_run_id == '' }}
        shell: bash
        run: |
          chmod +x ci/patch-sdl2-ndk-r27.sh ci/build-korean-native-kr1.sh
          ./ci/patch-sdl2-ndk-r27.sh
          ./ci/build-korean-native-kr1.sh

      - name: Reuse verified journal native artifact
        if: ${{ inputs.native_run_id != '' }}
        shell: bash
        env:
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name OpenMW-0.51.0-11-Korean-native-KR1-Test-16K --dir native-artifacts
          grep -Fq 'munument1/-KR-openmw@6d7a582ea7dc8b8b19a5b70c8daa838aca491df1' native-artifacts/korean-origin.txt
          grep -Fq 'journal_keywords=30c11ee6c71149f6173b1c25f4ff46aca101774a' native-artifacts/korean-origin.txt
          grep -Fq 'journal=6a5bd36009c6de5179315626313ce7c383865bf2' native-artifacts/korean-origin.txt
          grep -Fq 'journal_index=9a66785d1da67216867bc4f61d8271bc601fc280' native-artifacts/korean-origin.txt

      - name: Package and verify 16K Korean APK
        shell: bash
        env:
          NATIVE_INPUT: native-artifacts
        run: |
          chmod +x ci/package-korean-native-kr1.sh
          ./ci/package-korean-native-kr1.sh

      # KR5 data is prepared and verified separately; this job validates the runtime.
      - name: Package Korean data, font and video subtitles
        if: false
        shell: bash
        run: |
          chmod +x ci/package-korean-data.sh
          ./ci/package-korean-data.sh

      - name: Upload native runtime and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-0.51.0-11-Korean-native-KR1-Test-16K
          path: |
            native-artifacts/libopenmw.so
            native-artifacts/libopenmw.so.sha256
            native-artifacts/libs/*.so
            native-artifacts/upstream-libopenmw.sha256
            native-artifacts/page-size-report.txt
            native-artifacts/korean-origin.txt
            native-artifacts/korean-native-build.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Upload verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-Android-0.51.0-11-Korean-KR1-Test-16K
          path: |
            release-artifacts/OpenMW-Android-0.51.0-11-Korean-KR1-Test-16K.apk
            release-artifacts/OpenMW-Android-0.51.0-11-Korean-KR1-Test-16K.apk.sha256
            release-artifacts/16k-verification.txt
            release-artifacts/native-page-size-report.txt
            release-artifacts/apk-page-size-report.txt
            release-artifacts/native-build-page-size-report.txt
            release-artifacts/korean-origin.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Korean data package
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-Android-0.51.0-11-Korean-Data-KR3
          path: |
            release-artifacts/OpenMW-Android-0.51.0-11-Korean-Data-KR3.zip
            release-artifacts/OpenMW-Android-0.51.0-11-Korean-Data-KR3.zip.sha256
            release-artifacts/korean-data-verification.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
