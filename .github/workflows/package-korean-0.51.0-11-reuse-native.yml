name: Package Korean 0.51.0-11 with verified native runtime

on:
  push:
    branches:
      - update/openmw-0.51.0-11
    paths:
      - ci/package-reuse-trigger.txt

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install NDK r27d and Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'ndk;27.3.13750724' 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Reuse verified Korean native runtime from 0.51.0-10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-input/libs work/reuse
          gh release download android-korean-0.51.0-10-kr1             --repo "$GITHUB_REPOSITORY"             --pattern 'OpenMW-Android-0.51.0-10-Korean-KR1-16K.apk'             --pattern 'korean-origin.txt'             --dir work/reuse             --clobber

          OLD_APK='work/reuse/OpenMW-Android-0.51.0-10-Korean-KR1-16K.apk'
          test -s "$OLD_APK"
          for library in libopenmw.so libopenal.so libSDL2.so libGL.so libcollada-dom2.5-dp.so libc++_shared.so; do
            unzip -p "$OLD_APK" "lib/arm64-v8a/$library" > "native-input/libs/$library"
            test -s "native-input/libs/$library"
          done

          sha256sum native-input/libs/libopenmw.so > native-input/libopenmw.so.sha256
          cp work/reuse/korean-origin.txt native-input/korean-origin.txt

          READELF="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$READELF"
          {
            echo 'reuse_source=android-korean-0.51.0-10-kr1'
            echo 'reuse_reason=0.51.0-11 changes only Android version metadata and Osk.kt; native engine source is unchanged'
            echo 'required_min_load_align=0x4000'
            for so in native-input/libs/*.so; do
              name="$(basename "$so")"
              min=''
              while read -r align; do
                [[ -n "$align" ]] || continue
                if [[ -z "$min" ]] || (( align < min )); then min="$align"; fi
              done < <("$READELF" -lW "$so" | awk '$1=="LOAD" {print $NF}')
              min="${min:-0}"
              printf '%s_min_load_align=0x%x\n' "$name" "$min"
              (( min >= 0x4000 ))
            done
          } | tee native-input/page-size-report.txt

      - name: Package and verify 0.51.0-11 Korean APK
        shell: bash
        env:
          NATIVE_INPUT: native-input
        run: |
          chmod +x ci/package-korean-native-kr1.sh
          ./ci/package-korean-native-kr1.sh

      - name: Package KR3 Korean data
        shell: bash
        run: |
          chmod +x ci/package-korean-data.sh
          ./ci/package-korean-data.sh

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-Android-0.51.0-11-Korean-KR1-Test-16K
          path: |
            release-artifacts/OpenMW-Android-0.51.0-11-Korean-KR1-Test-16K.apk
            release-artifacts/OpenMW-Android-0.51.0-11-Korean-KR1-Test-16K.apk.sha256
            release-artifacts/16k-verification.txt
            release-artifacts/native-page-size-report.txt
            release-artifacts/apk-page-size-report.txt
            release-artifacts/native-build-page-size-report.txt
            release-artifacts/korean-origin.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Korean data package
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-Android-0.51.0-11-Korean-Data-KR3
          path: |
            release-artifacts/OpenMW-Android-0.51.0-11-Korean-Data-KR3.zip
            release-artifacts/OpenMW-Android-0.51.0-11-Korean-Data-KR3.zip.sha256
            release-artifacts/korean-data-verification.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
