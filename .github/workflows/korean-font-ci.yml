name: Korean bitmap font integration

on:
  push:
    branches: [agent/korean-bitmap-fonts]
  pull_request:
    paths:
      - 'source/buildscripts/patches/openmw051-final/apply-korean-cp949-bitmap-font.py'
      - 'source/tools/package-korean-retranslation-android.py'
      - 'source/tools/prepare-openmw-051-korean.ps1'
      - 'source/tools/build-openmw-051-korean.ps1'
      - '.github/workflows/korean-font-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source patch and mapping
        env:
          OPENMW_COMMIT: f4bec41444214a7903bebd178389ca22ca13f646
        run: |
          set -euo pipefail
          python -m py_compile \
            source/buildscripts/patches/openmw051-final/apply-korean-cp949-bitmap-font.py \
            source/tools/package-korean-retranslation-android.py
          git clone --filter=blob:none https://github.com/OpenMW/openmw.git /tmp/openmw
          git -C /tmp/openmw checkout "$OPENMW_COMMIT"
          python source/buildscripts/patches/openmw051-final/apply-korean-cp949-bitmap-font.py /tmp/openmw
          python source/buildscripts/patches/openmw051-final/apply-korean-cp949-bitmap-font.py /tmp/openmw
          grep -Fq 'OPENMW_ANDROID_051_KOREAN_CP949_BITMAP' /tmp/openmw/components/fontloader/fontloader.cpp
          grep -Fq 'std::array<Glyph, 11172>' /tmp/openmw/components/fontloader/koreancp949bitmap.hpp
          ! grep -Fq 'OPENMW_ANDROID_051_KOREAN_FONT_ALIAS' /tmp/openmw/components/fontloader/fontloader.cpp
          cat >/tmp/korean-header-test.cpp <<'EOF'
          #include "/tmp/openmw/components/fontloader/koreancp949bitmap.hpp"
          static_assert(KoreanCp949Bitmap::glyphs.size() == 11172);
          static_assert(KoreanCp949Bitmap::glyphs.front().codepoint == 0xAC00);
          static_assert(KoreanCp949Bitmap::glyphs.back().codepoint == 0xD7A3);
          int main() { return 0; }
          EOF
          g++ -std=c++20 -fsyntax-only /tmp/korean-header-test.cpp

      - name: Locate and validate existing CP949 font payload
        env:
          FONT_SHA: 3a7d2442d43d7ed9e0b42d6d8d75068340b00893e06bb2fa696d4ac440bbeee7
        run: |
          set -euo pipefail
          FONT=/tmp/Morrowind_CP949_Classic_Fonts.zip
          FOUND=''
          curl -fsSL --retry 4 \
            'https://api.github.com/repos/munument1/Morrowind-CP949/releases?per_page=100' \
            -o /tmp/releases.json
          mapfile -t rows < <(jq -r '.[] as $r | $r.assets[]? |
            select((.name | ascii_downcase) | contains("font")) |
            [$r.tag_name,.name,.browser_download_url] | @tsv' /tmp/releases.json)
          for row in "${rows[@]}"; do
            IFS=$'\t' read -r tag name url <<< "$row"
            echo "Checking release font candidate: $tag / $name"
            if curl -fL --retry 3 "$url" -o /tmp/candidate.zip && \
               echo "$FONT_SHA  /tmp/candidate.zip" | sha256sum -c - >/dev/null 2>&1; then
              mv /tmp/candidate.zip "$FONT"
              FOUND="release:$tag/$name"
              break
            fi
          done

          if [[ -z "$FOUND" ]]; then
            git clone --depth 1 --branch font-release-upload-temp-20260808 \
              https://github.com/munument1/Morrowind-CP949.git /tmp/cp949-source
            : >/tmp/font-pack.xz
            for part in /tmp/cp949-source/.release-upload/parts/part_*.b64; do
              base64 -d "$part" >> /tmp/font-pack.xz
            done
            xz -dc /tmp/font-pack.xz > "$FONT"
            echo "$FONT_SHA  $FONT" | sha256sum -c -
            FOUND='repository-upload-source'
          fi

          echo "Verified CP949 font source: $FOUND"
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p = Path('source/tools/package-korean-retranslation-android.py')
          spec = importlib.util.spec_from_file_location('pkg', p)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          pack = Path('/tmp/Morrowind_CP949_Classic_Fonts.zip')
          mod.verify_font_pack_archive(pack)
          payload, report = mod.build_font_payload(pack)
          required = {'MysticCards.fnt','magic_cards_regular.fnt','DemonicLetters.fnt',
                      'daedric_font.fnt','century_gothic_font_regular.fnt','century_gothic_big.fnt'}
          assert required <= set(payload), sorted(required - set(payload))
          assert payload['MysticCards.fnt'] == payload['magic_cards_regular.fnt']
          assert payload['DemonicLetters.fnt'] == payload['daedric_font.fnt']
          print('PASS verified CP949 FNT/TEX payload')
          print('\n'.join(report))
          PY

  build-apk:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gettext-base pkg-config unzip bzip2 xz-utils \
            wget curl git ninja-build autoconf automake libtool nasm yasm
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'ndk;26.1.10909125'

      - name: Add Korean FontLoader to clean patch chain
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('source/buildscripts/CMakeLists.txt')
          t = p.read_text(encoding='utf-8')
          kr = '        python3 ${CMAKE_SOURCE_DIR}/patches/openmw051-final/apply-korean-cp949-bitmap-font.py <SOURCE_DIR>'
          if kr not in t:
              a = '        python3 ${CMAKE_SOURCE_DIR}/patches/openmw051-final/apply-android-gl4es-core-inline.py <SOURCE_DIR>'
              if t.count(a) != 1:
                  raise SystemExit(f'expected one GL4ES patch anchor, found {t.count(a)}')
              t = t.replace(a, a + ' &&\n' + kr, 1)
              p.write_text(t, encoding='utf-8', newline='\n')
          PY

      - name: Build final ARM64 native runtime
        working-directory: source/buildscripts
        run: |
          set -o pipefail
          chmod +x build.sh
          ./build.sh --arch arm64 --lto --jobs 2 --no-resources 2>&1 | tee korean-native-build.log

      - name: Verify native payload and refresh SHA gate
        run: |
          set -euo pipefail
          SRC='source/buildscripts/build/arm64/openmw-prefix/src/openmw'
          JNI='source/app/src/main/jniLibs/arm64-v8a/libopenmw.so'
          SYM='source/buildscripts/symbols/arm64-v8a/libopenmw.so'
          grep -Fq 'OPENMW_ANDROID_051_KOREAN_CP949_BITMAP' "$SRC/components/fontloader/fontloader.cpp"
          grep -Fq 'std::array<Glyph, 11172>' "$SRC/components/fontloader/koreancp949bitmap.hpp"
          grep -aFq 'OPENMW_ANDROID_051_KOREAN_CP949_BITMAP: mapped ' "$JNI"
          grep -aFq 'OPENMW_ANDROID_051_KOREAN_CP949_BITMAP: mapped ' "$SYM"
          JNI_SHA="$(sha256sum "$JNI" | awk '{print $1}')"
          printf '%s  %s\n' "$JNI_SHA" "$JNI" > source/buildscripts/openmw-051-patch39-libopenmw.sha256
          echo "Korean libopenmw.so SHA-256: $JNI_SHA"

      - name: Assemble final-gated mainline debug APK
        working-directory: source
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleMainlineDebug --stacktrace 2>&1 | tee korean-gradle-build.log

      - name: Verify APK has no FNT payload
        run: |
          set -euo pipefail
          APK='source/app/build/outputs/apk/mainline/debug/app-mainline-debug.apk'
          test -s "$APK"
          unzip -l "$APK" > /tmp/apk-files.txt
          if grep -Ei '(^|/)(fonts/)?[^/]*\.fnt$' /tmp/apk-files.txt; then
            echo 'FNT binary was embedded in APK; fonts belong in the ReTranslation mod.' >&2
            exit 1
          fi
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload Korean test APK
        uses: actions/upload-artifact@v4
        with:
          name: openmw-051-korean-fnt-test-apk
          path: |
            source/app/build/outputs/apk/mainline/debug/app-mainline-debug.apk
            source/app/build/outputs/apk/mainline/debug/app-mainline-debug.apk.sha256
            source/buildscripts/korean-native-build.log
            source/korean-gradle-build.log
          if-no-files-found: error
          retention-days: 14
