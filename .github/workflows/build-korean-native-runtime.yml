name: Build Korean 0.51.0-09 Native Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      JOBS: '4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install native build requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git curl wget patch unzip zip \
            perl autoconf automake libtool libtool-bin pkg-config bison flex \
            gettext gperf nasm yasm texinfo bzip2 xz-utils

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: |
            source/buildscripts/downloads
            source/buildscripts/toolchain
            source/buildscripts/prefix/arm64
            source/buildscripts/build/arm64
            !source/buildscripts/build/arm64/openmw-prefix
          key: ${{ runner.os }}-openmw051-09-r26b-arm64-deps-v1-${{ hashFiles('source/buildscripts/CMakeLists.txt', 'source/buildscripts/include/version.sh') }}
          restore-keys: |
            ${{ runner.os }}-openmw051-09-r26b-arm64-deps-v1-

      - name: Build Korean native runtime
        shell: bash
        run: |
          chmod +x ci/build-korean-native-kr1.sh
          ./ci/build-korean-native-kr1.sh

      - name: Upload Korean native runtime
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-Android-0.51.0-09-Korean-Native-Runtime
          path: |
            native-artifacts/libopenmw.so
            native-artifacts/libopenmw.so.sha256
            native-artifacts/upstream-libopenmw.sha256
            native-artifacts/korean-origin.txt
            native-artifacts/page-size-report.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-Android-0.51.0-09-Korean-Native-Diagnostics
          path: |
            native-artifacts/korean-native-build.log
            native-artifacts/page-size-report.txt
            native-artifacts/korean-origin.txt
            native-artifacts/upstream-libopenmw.sha256
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
