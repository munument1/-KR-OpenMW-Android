name: Publish Android Korean 0.51.0-10 KR1

on:
  push:
    branches:
      - main
    paths:
      - ci/publish-android-0.51.0-10-kr1-trigger.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATED_RUN: '34141240110'
      TARGET_COMMIT: 'd8c9c966e5e8d6c4f9c0d495b9098ab9300552cc'
      TAG: 'android-korean-0.51.0-10-kr1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated APK and Korean data artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-src/apk release-src/data release-assets
          gh run download "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" \
            --name 'OpenMW-Android-0.51.0-10-Korean-KR1-Test-16K' \
            --dir release-src/apk
          gh run download "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" \
            --name 'OpenMW-Android-0.51.0-10-Korean-Data-KR3' \
            --dir release-src/data

      - name: Verify and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          TEST_APK='release-src/apk/OpenMW-Android-0.51.0-10-Korean-KR1-Test-16K.apk'
          DATA_ZIP='release-src/data/OpenMW-Android-0.51.0-10-Korean-Data-KR3.zip'
          test -s "$TEST_APK"
          test -s "$DATA_ZIP"
          test -s release-src/apk/16k-verification.txt
          test -s release-src/apk/korean-origin.txt
          test -s release-src/data/korean-data-verification.txt

          test "$(sha256sum "$TEST_APK" | awk '{print $1}')" = 'a699adb81b0539ed115fb575167b48d287dd87e4fd060fdc23704a4db9216c8b'
          test "$(sha256sum "$DATA_ZIP" | awk '{print $1}')" = 'd7dfdb515b32469d8b1e7abdad97c79ebcdfb46dc095e3d1e9a9b5eea9b544a4'

          cp "$TEST_APK" 'release-assets/OpenMW-Android-0.51.0-10-Korean-KR1-16K.apk'
          cp "$DATA_ZIP" 'release-assets/OpenMW-Android-0.51.0-10-Korean-Data-KR1.zip'
          cp release-src/apk/16k-verification.txt release-assets/
          cp release-src/apk/korean-origin.txt release-assets/
          cp release-src/data/korean-data-verification.txt release-assets/

          (cd release-assets && sha256sum OpenMW-Android-0.51.0-10-Korean-KR1-16K.apk > OpenMW-Android-0.51.0-10-Korean-KR1-16K.apk.sha256)
          (cd release-assets && sha256sum OpenMW-Android-0.51.0-10-Korean-Data-KR1.zip > OpenMW-Android-0.51.0-10-Korean-Data-KR1.zip.sha256)

          grep -Fq 'result=PASS' release-assets/korean-data-verification.txt
          grep -Fq 'subtitle_count=10' release-assets/korean-data-verification.txt
          grep -Fq 'versionName=0.51.0-10' release-assets/16k-verification.txt
          grep -Fq 'versionCode=5110' release-assets/16k-verification.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          # OpenMW Android 0.51.0-10 Korean KR1

          Andiweli/OpenMW-Android **0.51.0-10** 기반 한국어 지원판입니다.

          ## 주요 변경 사항
          - upstream 0.51.0-10 기준으로 동기화
          - 한국어/CJK 대화 토픽 탐색 보정
          - UTF-8 BOM `.cel` / `.top` / `.mrk` 사이드카 지원
          - UTF-8 한글 ESM/ESP 문자열 처리 보정
          - 이전 한국어 세이브 저널 복구
          - OpenMW 영상 위젯의 외부 **UTF-8 SRT 자막 지원**
          - `video/<영상명>.bik` 재생 시 같은 VFS 경로의 `video/<영상명>.srt` 자동 탐색
          - 본편 3개 + Bloodmoon 7개, 총 **10개 한국어 영상 자막** 데이터 포함
          - Gowun Batang 기반 MysticCards 한국어 폰트 포함
          - `Movies_New_Game=mw_intro.bik` 등 원본 Morrowind 영상 fallback 보정
          - NDK r27d 기반 ARM64 빌드 및 **16 KiB ELF/APK 정렬 검증** 완료
          - Android 런처 한국어 번역 반영

          ## 다운로드
          1. `OpenMW-Android-0.51.0-10-Korean-KR1-16K.apk` 설치
          2. `OpenMW-Android-0.51.0-10-Korean-Data-KR1.zip` 압축 해제
          3. `Morrowind_Korean_ReTranslation` 폴더를 Android 기기에 복사
          4. OpenMW Android 런처에서 해당 폴더를 데이터 디렉터리로 추가
          5. `Morrowind_Korean_ReTranslation.esp` 활성화

          한국어 데이터 ZIP에는 ESP/CEL/MRK/TOP/l10n, Gowun Batang 폰트, SRT 자막 10개가 들어 있습니다. 원본 Bethesda 게임 데이터와 BIK 영상은 포함하지 않습니다.

          ## 검증
          GitHub Actions Run `34141240110`에서 한국어 패치 0001~0005 네이티브 빌드, APK 패키징, versionName `0.51.0-10` / versionCode `5110`, ARM64 16 KiB ELF LOAD 정렬, APK 16 KiB zipalign, 한국어 데이터/SRT 10개 패키징을 검증했습니다.

          ## 참고
          이 APK는 Android debug 인증서로 서명되어 있습니다. 기존 설치본과 서명이 다르면 설정과 세이브 데이터를 백업한 뒤 기존 앱을 제거하고 설치해야 할 수 있습니다.
          EOF

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_COMMIT" \
            --title 'OpenMW Android 0.51.0-10 Korean KR1 (16 KiB)' \
            --notes-file release-notes.md \
            release-assets/*

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'OpenMW-Android-0.51.0-10-Korean-KR1-16K.apk' --dir verify
          test "$(sha256sum verify/OpenMW-Android-0.51.0-10-Korean-KR1-16K.apk | awk '{print $1}')" = 'a699adb81b0539ed115fb575167b48d287dd87e4fd060fdc23704a4db9216c8b'
